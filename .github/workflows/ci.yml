name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"
  UV_PYTHON: "3.12"
  TRIVY_IMAGE: "aquasec/trivy:0.76.2"
  IMAGE_TAG: "sdlc-manager:ci"

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen --no-build
      - run: uv run --frozen --no-build ruff check .
      - run: uv run --frozen --no-build ruff format --check .

  test:
    name: test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen --no-build
      - run: uv run --frozen --no-build pytest --cov --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7
      - name: Migraciones desde 0001
        run: |
          mkdir -p data
          rm -f data/sdlc_manager.db
          uv run --frozen --no-build alembic upgrade 0001
          uv run --frozen --no-build alembic upgrade head

  quality:
    name: quality
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen --no-build
      - run: uv run --frozen --no-build mypy src

  sonar:
    name: sonar
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - name: SonarCloud no configurado
        if: env.SONAR_TOKEN == '' || env.SONAR_ORGANIZATION == '' || env.SONAR_PROJECT_KEY == ''
        run: echo "SONAR_TOKEN, SONAR_ORGANIZATION o SONAR_PROJECT_KEY no configurados; se omite SonarCloud."
      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != ''
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        if: env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != ''
        with:
          name: coverage
      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        if: env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != ''
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.python.version=3.12
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  security:
    name: security
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Trivy fs (reporte HIGH y CRITICAL)
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --format json --output trivy-fs.json \
            --exit-code 0 .
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --format table --exit-code 0 .
      - name: Trivy fs (bloquea CRITICAL)
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" fs \
            --scanners vuln,secret,misconfig \
            --severity CRITICAL \
            --exit-code 1 .
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-fs
          path: trivy-fs.json
          retention-days: 7

  build:
    name: build
    needs: [test, quality, sonar, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build --pull --tag "$IMAGE_TAG" .
      - run: docker save "$IMAGE_TAG" --output image.tar
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.tar
          retention-days: 1

  image_security:
    name: image_security
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image
      - name: Trivy image (reporte HIGH y CRITICAL)
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" image \
            --input image.tar \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --format json --output trivy-image.json \
            --exit-code 0
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" image \
            --input image.tar \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --format table --exit-code 0
      - name: Trivy image (bloquea CRITICAL)
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" image \
            --input image.tar \
            --scanners vuln,secret,misconfig \
            --severity CRITICAL \
            --exit-code 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-image
          path: trivy-image.json
          retention-days: 7

  sbom:
    name: sbom
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: SBOM CycloneDX
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE" fs \
            --scanners vuln \
            --format cyclonedx --output sbom.cdx.json \
            --exit-code 0 .
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 7
