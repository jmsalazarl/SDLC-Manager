[project]
name = "sdlc-manager"
version = "0.1.0"
description = "Servidor MCP local para gobernanza y conocimiento del SDLC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.14.1",
    "mcp==2.3.0",
    "pydantic==2.12.4",
    "pydantic-settings==2.11.0",
    "pyyaml==6.0.2",
    "sqlalchemy==2.0.48",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy==1.15.0",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "pytest-cov==7.1.0",
    "ruff==0.9.7",
    "types-PyYAML==6.0.12.20250915",
]

[project.scripts]
sdlc-manager = "sdlc_manager.__main__:main"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["^tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"


[tool.coverage.run]
source = ["src"]
branch = true
relative_files = true

[tool.coverage.xml]
output = "coverage.xml"
